# Keeps the bundled market data current.
#
# The game is a static client-side bundle with no backend, so there is nowhere
# to put an API key at runtime and nothing on a child's device ever talks to a
# data provider. The data is fetched here instead, on a schedule, and committed —
# which means the app stays static, the key stays server-side, and the numbers
# are never more than a day old.
#
# Fundamentals come from SEC EDGAR and need no key at all — though the SEC now
# returns 403 to GitHub Actions' address ranges, so the fetch carries the
# previous filings forward and writes fresh prices anyway. `fundamentalsCarried`
# records that it did, and `check-market-data.mjs` fails the build if it has
# been carrying them for more than a hundred days.
#
# Prices come from Alpha Vantage, which is official and documented. The free
# tier allows 25 requests a day and asks for no more than one a second; there
# are twenty-four companies, so **a refresh uses twenty-four of the
# twenty-five** and one scheduled run a day fits exactly. Any extra run that
# day — a manual dispatch, a local test — will find the allowance spent and
# fall back to Yahoo's keyless endpoint **per ticker**, which keeps the market
# alive rather than writing nothing. The two sources return the same adjusted
# weekly closes: measured at 261 aligned weeks, worst disagreement 0.011%.
#
# `check-market-data.mjs` prints which companies came from which source, and
# compares every settled weekly close against the last commit so a silent
# change of series fails rather than ships.
name: Refresh market data

on:
  schedule:
    # 09:30 UTC on weekdays — after the previous US close has settled.
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Said in the run summary rather than in a document, because a document
      # nobody opens is how this pipeline came to fail in silence for a
      # fortnight. See PRODUCT.md §79.
      #
      # Both secrets are checked, and the User-Agent one is not cosmetic: a
      # secret that does not exist arrives here as an **empty string**, and
      # `process.env.X ?? fallback` does not fall back on `''` — so every run
      # before this sent the SEC an empty User-Agent, which is the one thing
      # they ask you not to do. `envOr` in `scripts/env.mjs` fixes the reading
      # side; this makes the absence visible.
      - name: Say which sources this run is about to use
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$ALPHAVANTAGE_KEY" ]; then
            echo "::warning title=Unofficial price source::ALPHAVANTAGE_KEY is not set, so prices come from Yahoo's chart endpoint. It is undocumented and can change shape without notice."
            echo "Prices: **Yahoo chart endpoint (unofficial)** — \`ALPHAVANTAGE_KEY\` is not set." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Prices: Alpha Vantage (official, keyed). 24 of the 25 daily requests." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::warning title=No SEC User-Agent::SEC_USER_AGENT is not set, so the filings fetch falls back to the maintainer's address. The SEC asks for a real one and may refuse requests without it."
            echo "Filings: falling back to the built-in User-Agent." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch real fundamentals and weekly closes
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: npm run data

      - name: Check what was written
        run: npm run data:check

      # The tests read the bundled data, so a refresh that would break the game
      # never gets committed. Every assertion about the numbers is a property
      # rather than a literal, precisely so this can pass on fresh data.
      - name: Make sure the game still works on the new numbers
        run: npm test

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- src/lib/market-data.json; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/market-data.json
          git commit -m "chore(data): refresh market data"
          git push
